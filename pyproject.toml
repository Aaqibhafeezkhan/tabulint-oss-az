[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabulint"
version = "0.1.0"
description = "A lightweight open-source CLI and Python library for practical CSV/JSON data-quality checks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["csv", "json", "data-quality", "linter", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tabulint = "tabulint.cli:main"

[project.urls]
Homepage = "https://github.com/ismayilzeynal/tabulint-oss-az"
Issues = "https://github.com/ismayilzeynal/tabulint-oss-az/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tabulint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
