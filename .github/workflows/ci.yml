name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check core types
        run: python -m mypy

      - name: Smoke-test the CLI
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          Path("clean.csv").write_text("name,age\nAda,36\nGrace,45\n", encoding="utf-8")
          subprocess.run(["tabulint", "clean.csv"], check=True)
